name: iOS TestFlight

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: Build iOS and submit to TestFlight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      # Needed to publish the GitHub Release that records the build provenance.
      contents: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expected a semver tag like v1.2.3, got $GITHUB_REF_NAME." >&2
            exit 1
          }
          git fetch origin main
          RELEASE_SHA="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || {
            echo "Tag $GITHUB_REF_NAME does not point to a commit on origin/main." >&2
            exit 1
          }

      - name: Verify tag matches app version
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p "require('./app.json').expo.version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          [ "$APP_VERSION" = "$TAG_VERSION" ] || {
            echo "Tag $GITHUB_REF_NAME does not match app.json version $APP_VERSION." >&2
            echo "Bump expo.version in app.json, or tag the version that is there." >&2
            exit 1
          }
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Verify required secrets
        run: |
          set -euo pipefail
          [ -n "$EXPO_TOKEN" ] || {
            echo "Missing EXPO_TOKEN repository secret." >&2
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and submit with EAS
        run: |
          set -euo pipefail
          npx eas-cli@latest build \
            --platform ios \
            --profile production \
            --auto-submit \
            --wait \
            --non-interactive \
            --json \
            --message "$GITHUB_REF_NAME ($GITHUB_SHA)" \
            --what-to-test "Built from commit ${GITHUB_SHA:0:7} — ${{ github.server_url }}/${{ github.repository }}/commit/$GITHUB_SHA" \
            > eas-build.json

      - name: Read build metadata
        run: |
          set -euo pipefail
          BUILD_ID="$(jq -r '.[0].id' eas-build.json)"
          BUILD_NUMBER="$(jq -r '.[0].appBuildVersion' eas-build.json)"
          BUILD_COMMIT="$(jq -r '.[0].gitCommitHash' eas-build.json)"
          BUILD_STATUS="$(jq -r '.[0].status' eas-build.json)"

          [ "$BUILD_STATUS" = "FINISHED" ] || {
            echo "EAS build finished with status $BUILD_STATUS." >&2
            exit 1
          }

          # The whole point of the release: the artifact Apple distributes must be
          # traceable to the tagged commit. If EAS built anything else, stop before
          # publishing a claim that would be false.
          [ "$BUILD_COMMIT" = "$GITHUB_SHA" ] || {
            echo "EAS built commit $BUILD_COMMIT but the tag points at $GITHUB_SHA." >&2
            exit 1
          }

          {
            echo "BUILD_ID=$BUILD_ID"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
          } >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        run: |
          set -euo pipefail
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/$GITHUB_SHA"

          cat > release-notes.md <<EOF
          ## iOS $APP_VERSION ($BUILD_NUMBER)

          The TestFlight and App Store build labelled **$APP_VERSION ($BUILD_NUMBER)** was built
          from commit [\`${GITHUB_SHA:0:7}\`]($COMMIT_URL).

          | | |
          | --- | --- |
          | Commit | \`$GITHUB_SHA\` |
          | Marketing version | \`$APP_VERSION\` |
          | iOS build number | \`$BUILD_NUMBER\` |
          | EAS build id | \`$BUILD_ID\` |
          | Built at | \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\` |

          ### Verifying the build you installed

          Open the app, go to **Settings → About**. It shows the same version, build
          number, and commit; tapping the commit opens it on GitHub. If the three
          values match this release, the binary on your device came from this source.

          This is build provenance, not a bit-for-bit reproducible build — Apple
          re-signs and re-encrypts the binary during processing, so the artifact you
          download can never be byte-identical to a locally produced one.
          EOF

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag

      - name: Job summary
        if: always()
        run: |
          {
            echo "### iOS release $GITHUB_REF_NAME"
            echo ""
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Version: \`${APP_VERSION:-unknown}\` (\`${BUILD_NUMBER:-unknown}\`)"
            echo "- EAS build: \`${BUILD_ID:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"

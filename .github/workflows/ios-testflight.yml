name: iOS TestFlight

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: Build iOS and submit to TestFlight
    runs-on: ubuntu-latest
    # EAS free-tier builds ran ~65 min and the auto-submit can sit in Apple's
    # processing queue for another hour. 120 min killed the v1.8.0 run while
    # the submission was still in flight, after the build had already shipped.
    timeout-minutes: 240
    permissions:
      # Needed to publish the GitHub Release that records the build provenance.
      contents: write
      # Sigstore signing identity for the build provenance attestation. This is
      # what makes the release record something other than a self-assertion:
      # the signature comes from GitHub's OIDC identity for this workflow, and a
      # release published by hand cannot carry one.
      id-token: write
      attestations: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expected a semver tag like v1.2.3, got $GITHUB_REF_NAME." >&2
            exit 1
          }
          git fetch origin main
          RELEASE_SHA="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || {
            echo "Tag $GITHUB_REF_NAME does not point to a commit on origin/main." >&2
            exit 1
          }

      - name: Verify tag matches app version
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p "require('./app.json').expo.version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          [ "$APP_VERSION" = "$TAG_VERSION" ] || {
            echo "Tag $GITHUB_REF_NAME does not match app.json version $APP_VERSION." >&2
            echo "Bump expo.version in app.json, or tag the version that is there." >&2
            exit 1
          }
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Verify required secrets
        run: |
          set -euo pipefail
          [ -n "$EXPO_TOKEN" ] || {
            echo "Missing EXPO_TOKEN repository secret." >&2
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and submit with EAS
        run: |
          set -euo pipefail
          # No --what-to-test: EAS forwards it as the submission's `changelog`
          # field, and Apple/Expo reject that on anything but an Enterprise
          # plan ("Changelog submission is currently available for Enterprise
          # plan only"). The commit and run are recorded in the GitHub Release
          # notes instead; testers can read those.
          npx eas-cli@latest build \
            --platform ios \
            --profile production \
            --auto-submit \
            --wait \
            --non-interactive \
            --json \
            --message "$GITHUB_REF_NAME ($GITHUB_SHA)" \
            > eas-build-scheduled.json

      - name: Read build metadata
        run: |
          set -euo pipefail
          BUILD_ID="$(jq -r '.[0].id // empty' eas-build-scheduled.json)"
          [ -n "$BUILD_ID" ] || {
            echo "EAS returned no build id." >&2
            exit 1
          }

          # `--json` writes the build record as it was *scheduled*: status NEW,
          # and no artifact URL yet. `--wait` then blocks until the build and
          # the submission finish, but never rewrites that file — so reading it
          # reported a long-finished build as still queued, and every release
          # since v1.3.0 failed here after building and shipping successfully.
          # Re-read the build to get its terminal state. `build:view` returns a
          # bare object; older versions returned a one-element array, so take
          # either shape. It has also failed intermittently right after the
          # submit finishes (v1.6.0/v1.7.0, "build:view command failed", exit 5)
          # — so capture the raw output for diagnosis and retry a few times
          # before letting a transient EAS API hiccup kill the release.
          fetch_build_json() {
            for attempt in 1 2 3 4 5; do
              if npx eas-cli@latest build:view "$BUILD_ID" --json --non-interactive \
                  > build-view-raw.json 2> build-view-err.txt; then
                if jq 'if type == "array" then .[0] else . end' \
                    build-view-raw.json > eas-build.json 2>/dev/null; then
                  return 0
                fi
              fi
              echo "build:view attempt $attempt failed; retrying in 30s" >&2
              cat build-view-err.txt >&2 || true
              head -c 500 build-view-raw.json >&2 || true
              sleep 30
            done
            return 1
          }
          fetch_build_json

          BUILD_NUMBER="$(jq -r '.appBuildVersion' eas-build.json)"
          BUILD_COMMIT="$(jq -r '.gitCommitHash' eas-build.json)"
          BUILD_STATUS="$(jq -r '.status' eas-build.json)"

          [ "$BUILD_STATUS" = "FINISHED" ] || {
            echo "EAS build finished with status $BUILD_STATUS." >&2
            exit 1
          }

          # The whole point of the release: the artifact Apple distributes must be
          # traceable to the tagged commit. If EAS built anything else, stop before
          # publishing a claim that would be false.
          [ "$BUILD_COMMIT" = "$GITHUB_SHA" ] || {
            echo "EAS built commit $BUILD_COMMIT but the tag points at $GITHUB_SHA." >&2
            exit 1
          }

          ARCHIVE_URL="$(jq -r '.artifacts.applicationArchiveUrl // empty' eas-build.json)"
          [ -n "$ARCHIVE_URL" ] || {
            echo "EAS build JSON carries no application archive URL." >&2
            exit 1
          }

          {
            echo "BUILD_ID=$BUILD_ID"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
            echo "ARCHIVE_URL=$ARCHIVE_URL"
          } >> "$GITHUB_ENV"

      - name: Hash the artifact that was submitted
        run: |
          set -euo pipefail
          curl -fsSL "$ARCHIVE_URL" -o app.ipa

          # The JS bundle is the code that actually runs. Unlike the Mach-O
          # binary it is a plain resource, so Apple neither re-signs nor
          # FairPlay-encrypts it — it is the one part of the shipped app that
          # can still be compared against a bundle built from the source.
          BUNDLE_ENTRY="$(unzip -Z1 app.ipa 'Payload/*.app/*.jsbundle' | head -n 1)"
          [ -n "$BUNDLE_ENTRY" ] || {
            echo "No .jsbundle inside the IPA — cannot publish a bundle hash." >&2
            exit 1
          }
          unzip -p app.ipa "$BUNDLE_ENTRY" > main.jsbundle

          {
            echo "IPA_SHA256=$(sha256sum app.ipa | cut -d ' ' -f 1)"
            echo "BUNDLE_SHA256=$(sha256sum main.jsbundle | cut -d ' ' -f 1)"
            echo "BUNDLE_ENTRY=$BUNDLE_ENTRY"
          } >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            app.ipa
            main.jsbundle

      - name: Publish GitHub Release
        run: |
          set -euo pipefail
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/$GITHUB_SHA"

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          cat > release-notes.md <<EOF
          ## iOS $APP_VERSION ($BUILD_NUMBER)

          The build labelled **$APP_VERSION ($BUILD_NUMBER)** in TestFlight and the App Store was
          produced by [this workflow run]($RUN_URL) from commit
          [\`${GITHUB_SHA:0:7}\`]($COMMIT_URL).

          | | |
          | --- | --- |
          | Commit | \`$GITHUB_SHA\` |
          | Marketing version | \`$APP_VERSION\` |
          | iOS build number | \`$BUILD_NUMBER\` |
          | EAS build id | \`$BUILD_ID\` |
          | Submitted IPA, SHA-256 | \`$IPA_SHA256\` |
          | JS bundle, SHA-256 | \`$BUNDLE_SHA256\` |
          | Built at | \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\` |

          ### Verifying this release

          Both artifacts carry a [Sigstore](https://www.sigstore.dev/) attestation signed by
          GitHub's identity for this workflow — not by the maintainer. A release published by
          hand cannot carry one:

          \`\`\`
          gh attestation verify main.jsbundle --repo ${{ github.repository }}
          \`\`\`

          \`main.jsbundle\` is attached below: it is the JavaScript that actually runs in the
          shipped app, extracted from the IPA that was submitted to Apple. Apple re-signs and
          encrypts the native binary, but leaves resources like this one untouched, so it is the
          part of the app that can still be read and compared against the source at
          \`${GITHUB_SHA:0:7}\`.

          ### What this does not prove

          This is provenance, not a reproducible build. You are trusting GitHub, Expo, and Apple
          — but not the maintainer's laptop. Nothing here lets you verify the copy of the app on
          your own device: iOS gives you no way to extract and hash it. What you can check is
          that the artifact Apple received came from this public commit through this public
          workflow run.
          EOF

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            main.jsbundle

      - name: Job summary
        if: always()
        run: |
          {
            echo "### iOS release $GITHUB_REF_NAME"
            echo ""
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Version: \`${APP_VERSION:-unknown}\` (\`${BUILD_NUMBER:-unknown}\`)"
            echo "- EAS build: \`${BUILD_ID:-unknown}\`"
            echo "- IPA SHA-256: \`${IPA_SHA256:-unknown}\`"
            echo "- JS bundle SHA-256: \`${BUNDLE_SHA256:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"

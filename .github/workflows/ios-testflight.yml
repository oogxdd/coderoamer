name: iOS TestFlight

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: Build iOS and submit to TestFlight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expected a semver tag like v1.2.3, got $GITHUB_REF_NAME." >&2
            exit 1
          }
          git fetch origin main
          RELEASE_SHA="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || {
            echo "Tag $GITHUB_REF_NAME does not point to a commit on origin/main." >&2
            exit 1
          }

      - name: Verify required secrets
        run: |
          set -euo pipefail
          [ -n "$EXPO_TOKEN" ] || {
            echo "Missing EXPO_TOKEN repository secret." >&2
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and submit with EAS
        run: |
          npx eas-cli@latest build \
            --platform ios \
            --profile production \
            --auto-submit \
            --wait \
            --non-interactive \
            --message "GitHub Actions $GITHUB_REF_NAME" \
            --what-to-test "Automated release $GITHUB_REF_NAME"
